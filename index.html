<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EAC — Découvrez votre métier</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&f[]=satoshi@400,500&display=swap">
  <style>
    :root {
      --rouge:  #DC0D17;
      --navy:   #1C2459;
      --teal:   #00667D;
      --dark:   #000721;
      --white:  #FFFFFF;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse 80% 55% at 105% -5%, rgba(0,102,125,.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at -10% 110%, rgba(28,36,89,.6) 0%, transparent 55%);
      color: var(--white);
      font-family: 'Satoshi', system-ui, sans-serif;
      font-weight: 400;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100svh;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Logo ─────────────────────────────────────────────── */
    .logo {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
      color: var(--white);
      line-height: 1;
      user-select: none;
    }
    .logo .a { color: var(--rouge); }

    /* ── Screens ──────────────────────────────────────────── */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      padding: 28px 22px 36px;
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      will-change: transform, opacity;
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active  { display: flex; }
    .screen.entering { animation: screenIn  450ms ease-out both; }
    .screen.exiting  { animation: screenOut 220ms ease-in  both; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes screenOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-14px); }
    }

    /* ── Header row ───────────────────────────────────────── */
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      flex-shrink: 0;
    }

    /* ── Progress dots ────────────────────────────────────── */
    .progress {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      transition: background 300ms ease;
    }
    .dot.on { background: var(--rouge); }

    /* ── Screen body layout ───────────────────────────────── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding-bottom: 8px;
    }

    .tag {
      font-weight: 500;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .accent {
      width: 36px; height: 3px;
      background: var(--teal);
      border-radius: 2px;
    }

    .screen-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .screen-body {
      font-size: .9375rem;
      line-height: 1.65;
      color: rgba(255,255,255,.68);
    }

    /* ── Choices ──────────────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 13px;
      cursor: pointer;
      transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
      user-select: none;
    }
    .choice:hover {
      transform: translateX(6px);
      border-color: rgba(255,255,255,.32);
      background: rgba(255,255,255,.08);
    }
    .choice:active,
    .choice.flash { border-color: var(--rouge); }

    .choice-text {
      font-weight: 500;
      font-size: .9375rem;
      color: var(--white);
    }
    .choice-arrow {
      font-size: 1rem;
      color: rgba(255,255,255,.38);
      flex-shrink: 0;
    }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 17px 24px;
      background: var(--rouge);
      color: var(--white);
      border: none;
      border-radius: 13px;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.0625rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: opacity 200ms, transform 150ms;
      text-align: center;
    }
    .btn:hover  { opacity: .92; }
    .btn:active { transform: scale(.98); }

    /* ── s0 — Hero screen ─────────────────────────────────── */
    .badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(220,13,23,.14);
      border: 1px solid rgba(220,13,23,.3);
      border-radius: 100px;
      padding: 5px 13px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--rouge);
    }
    .badge-chip::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rouge);
      flex-shrink: 0;
    }

    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 24px 0;
    }

    .hero-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2.375rem;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .hero-body {
      font-size: 1rem;
      line-height: 1.65;
      color: rgba(255,255,255,.68);
    }

    .baseline {
      font-size: .8rem;
      font-weight: 500;
      color: rgba(255,255,255,.38);
      letter-spacing: .02em;
    }

    .bottom-wrap {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex-shrink: 0;
    }

    .hint {
      text-align: center;
      font-size: .8125rem;
      font-weight: 500;
      color: rgba(255,255,255,.35);
    }

    /* ── s4 — Crescendo screen ────────────────────────────── */
    .crescendo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0;
    }

    .crescendo-word {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2.125rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 480ms ease, transform 480ms ease;
    }
    .crescendo-word.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── result_* — Result screen ─────────────────────────── */
    .result-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0,102,125,.18);
      border: 1px solid rgba(0,102,125,.35);
      border-radius: 100px;
      padding: 5px 13px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--teal);
    }

    .result-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.12;
      letter-spacing: -0.03em;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 500ms ease, transform 500ms ease;
    }
    .result-title.reveal {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Modal ────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,7,33,.78);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--navy);
      border-radius: 22px 22px 0 0;
      padding: 28px 22px 44px;
      transform: translateY(100%);
      transition: transform 400ms cubic-bezier(.25,.46,.45,.94);
    }
    .overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 38px; height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-close {
      position: absolute;
      top: 18px; right: 18px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: none;
      color: var(--white);
      font-size: .9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 200ms;
    }
    .modal-close:hover { background: rgba(255,255,255,.18); }

    .modal-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      margin-bottom: 7px;
    }

    .modal-sub {
      font-size: .9375rem;
      color: rgba(255,255,255,.62);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 14px;
    }

    .field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 11px;
      color: var(--white);
      font-family: 'Satoshi', sans-serif;
      font-size: .9375rem;
      outline: none;
      transition: border-color 200ms;
    }
    .field::placeholder { color: rgba(255,255,255,.32); }
    .field:focus { border-color: var(--teal); }

    .btn-success { background: var(--teal) !important; }

    /* ── S0 — Badge card screen ───────────────────────────── */
    #s0 {
      background: linear-gradient(155deg, var(--dark) 0%, #00293a 55%, #004d5e 100%);
      justify-content: center;
      gap: 28px;
      padding: 48px 24px 44px;
    }

    .badge-card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      padding: 40px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }

    .badge-card .logo { font-size: 3.25rem; }

    .badge-card-school {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 700;
      font-size: .9375rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
    }

    .badge-card-divider {
      width: 44px; height: 2px;
      background: var(--rouge);
      border-radius: 1px;
    }

    .badge-card-accred {
      font-weight: 500;
      font-size: .6875rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.42);
    }

    .s0-baseline {
      text-align: center;
      font-size: .875rem;
      font-weight: 500;
      color: rgba(255,255,255,.38);
      line-height: 1.55;
      letter-spacing: .01em;
    }

    /* ── RGPD checkbox ────────────────────────────────────── */
    .rgpd-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .rgpd-check {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 18px; height: 18px;
      margin-top: 1px;
      border: 1.5px solid rgba(255,255,255,.28);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: border-color 200ms, background 200ms;
    }
    .rgpd-check:checked {
      background: var(--teal);
      border-color: var(--teal);
    }
    .rgpd-check:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .rgpd-text {
      font-size: .8rem;
      line-height: 1.5;
      color: rgba(255,255,255,.45);
    }
    .rgpd-text a { color: var(--teal); text-decoration: underline; }

    /* ── Modal confirmation view ──────────────────────────── */
    .modal-confirm {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding: 8px 0 4px;
    }
    .modal-confirm.show { display: flex; }

    .confirm-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(0,102,125,.18);
      border: 1.5px solid var(--teal);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
    }

    .confirm-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.375rem;
      letter-spacing: -0.02em;
    }

    .confirm-sub {
      font-size: .9375rem;
      color: rgba(255,255,255,.58);
      line-height: 1.6;
    }

    .confirm-restart {
      background: none;
      border: none;
      color: rgba(255,255,255,.4);
      font-family: 'Satoshi', sans-serif;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
      transition: color 200ms;
    }
    .confirm-restart:hover { color: rgba(255,255,255,.7); }
  </style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>

    <!-- Form view -->
    <div id="modal-form">
      <p class="tag" id="modal-metier-tag" style="margin-bottom:6px">Votre profil</p>
      <h2 class="modal-title">Réserve ton entretien</h2>
      <p class="modal-sub">Un conseiller EAC te rappelle sous 48h.</p>
      <div class="form-group">
        <input class="field" id="f-prenom" type="text"  placeholder="Prénom *"    autocomplete="given-name"   required>
        <input class="field" id="f-email"  type="email" placeholder="Email *"     autocomplete="email"        required>
        <input class="field" id="f-tel"    type="tel"   placeholder="Téléphone *" autocomplete="tel"          required>
        <input class="field" id="f-ville"  type="text"  placeholder="Ville *"     autocomplete="address-level2" required>
      </div>
      <label class="rgpd-label">
        <input class="rgpd-check" type="checkbox" id="f-rgpd" required>
        <span class="rgpd-text">J'accepte que mes données soient utilisées pour être recontacté(e) par EAC. <a href="#" onclick="return false">En savoir plus</a></span>
      </label>
      <button class="btn" id="submitBtn" onclick="submitForm()" style="margin-top:16px">Envoyer ma demande →</button>
    </div>

    <!-- Confirmation view -->
    <div class="modal-confirm" id="modal-confirm">
      <div class="confirm-icon">✓</div>
      <h3 class="confirm-title">Demande envoyée !</h3>
      <p class="confirm-sub">Un conseiller EAC te contactera dans les 48h pour ton entretien.</p>
      <button class="confirm-restart" onclick="restartFromModal()">Recommencer le quiz</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   A/B TESTING
══════════════════════════════════════════════════════════════ */
const VERSION = (new URLSearchParams(window.location.search).get('v') || 'a').toLowerCase();

const QUESTIONS_A = {};
const QUESTIONS_B = {};

const Q = VERSION === 'b' ? QUESTIONS_B : QUESTIONS_A;

/* ══════════════════════════════════════════════════════════════
   SCREEN DEFINITIONS
══════════════════════════════════════════════════════════════ */
const METIERS = [
  'galeriste','marchand','commissaire',
  'agent','programmateur','festival',
  'tendances','community','evenementiel'
];

const S2_ROUTES = {
  art:     ['galeriste','marchand','commissaire'],
  culture: ['agent','programmateur','festival'],
  luxe:    ['tendances','community','evenementiel']
};

const SCREENS = {};

SCREENS.s0 = { id:'s0', type:'hero', step:0 };

SCREENS.s1 = {
  id:'s1', type:'question', step:1,
  act:'Acte 1',
  title:'CONTENU À VENIR',
  body:'CONTENU À VENIR',
  choices:[
    { text:'Art',     target:'s2_art' },
    { text:'Culture', target:'s2_culture' },
    { text:'Luxe',    target:'s2_luxe' }
  ]
};

Object.entries(S2_ROUTES).forEach(([domain, metiers]) => {
  SCREENS[`s2_${domain}`] = {
    id:`s2_${domain}`, type:'question', step:2,
    act:'Acte 2',
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR',
    choices: metiers.map((m, i) => ({
      text:`Choix ${i+1} — CONTENU À VENIR`,
      target:`s3_${m}`
    }))
  };
});

METIERS.forEach(m => {
  SCREENS[`s3_${m}`] = {
    id:`s3_${m}`, type:'question', step:3,
    act:'Acte 3',
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR',
    choices:[
      { text:'Choix A — CONTENU À VENIR', target:`s4_${m}` },
      { text:'Choix B — CONTENU À VENIR', target:`s4_${m}` }
    ]
  };
});

METIERS.forEach(m => {
  SCREENS[`s4_${m}`] = {
    id:`s4_${m}`, type:'crescendo', step:4,
    next:`result_${m}`,
    words:['CONTENU','À','VENIR']
  };
});

METIERS.forEach(m => {
  SCREENS[`result_${m}`] = {
    id:`result_${m}`, type:'result', step:5,
    metier:m,
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR'
  };
});

/* ══════════════════════════════════════════════════════════════
   RENDER HELPERS
══════════════════════════════════════════════════════════════ */
function dots(filled) {
  return '<div class="progress">' +
    [0,1,2,3].map(i => `<div class="dot${i < filled ? ' on':''}"></div>`).join('') +
    '</div>';
}

function hdr(s) {
  const right = (s.step >= 1 && s.step <= 4) ? dots(s.step) : '';
  return `<div class="screen-header"><div class="logo">E<span class="a">A</span>C</div>${right}</div>`;
}

function buildHero() {
  return `
    <div class="badge-card">
      <div class="logo">E<span class="a">A</span>C</div>
      <p class="badge-card-school">École d'Art et de Culture</p>
      <div class="badge-card-divider"></div>
      <p class="badge-card-accred">Accréditation Visiteur</p>
    </div>
    <p class="s0-baseline">L'école du marché de l'art,<br>du luxe et de la culture</p>
    <div class="bottom-wrap">
      <button class="btn" onclick="go('s1')">Entrer →</button>
    </div>`;
}

function buildQuestion(s) {
  const d = Q[s.id] || {};
  const choicesHtml = s.choices.map(c =>
    `<div class="choice" onclick="choose(this,'${c.target}')">
       <span class="choice-text">${c.text}</span>
       <span class="choice-arrow">→</span>
     </div>`
  ).join('');
  return `${hdr(s)}
    <div class="screen-content">
      <span class="tag">${s.act}</span>
      <h2 class="screen-title">${d.title || s.title}</h2>
      <p class="screen-body">${d.body || s.body}</p>
    </div>
    <div class="choices">${choicesHtml}</div>`;
}

function buildCrescendo(s) {
  const words = s.words.map((w,i) =>
    `<div class="crescendo-word" data-i="${i}">${w}</div>`
  ).join('');
  return `${hdr(s)}
    <div class="screen-content">
      <span class="tag" style="color:rgba(255,255,255,.4)">Votre profil se dessine…</span>
      <div class="crescendo-list" id="cl_${s.id}">${words}</div>
    </div>`;
}

function buildResult(s) {
  const d = Q[s.id] || {};
  return `${hdr(s)}
    <div class="screen-content">
      <span class="result-pill">Votre métier</span>
      <div class="accent"></div>
      <h2 class="result-title" id="rt_${s.id}">${d.title || s.title}</h2>
      <p class="screen-body">${d.body || s.body}</p>
    </div>
    <div class="bottom-wrap">
      <button class="btn" onclick="openModal('${s.metier}')">Réserve ton entretien →</button>
      <p class="hint" style="cursor:pointer" onclick="go('s0')">Recommencer</p>
    </div>`;
}

const METIER_LABELS = {
  galeriste:      'Galeriste',
  marchand:       "Marchand d'art",
  commissaire:    "Commissaire d'exposition",
  agent:          "Agent d'artiste",
  programmateur:  'Programmateur culturel',
  festival:       'Directeur de festival',
  tendances:      'Analyste tendances',
  community:      'Community manager art',
  evenementiel:   'Chef de projet événementiel'
};

const BUILDERS = { hero:buildHero, question:buildQuestion, crescendo:buildCrescendo, result:buildResult };

/* ══════════════════════════════════════════════════════════════
   MOUNT ALL SCREENS
══════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');

Object.values(SCREENS).forEach(s => {
  const el = document.createElement('div');
  el.className = 'screen';
  el.id = s.id;
  el.innerHTML = BUILDERS[s.type](s);
  app.appendChild(el);
});

/* ══════════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════════ */
let current = null;
let busy    = false;

function go(id) {
  if (busy) return;
  const next = document.getElementById(id);
  if (!next) return;

  if (current) {
    busy = true;
    current.classList.add('exiting');
    const out = current;
    setTimeout(() => {
      out.classList.remove('active','exiting');
      activate(next, id);
    }, 220);
  } else {
    activate(next, id);
  }
}

function activate(el, id) {
  el.classList.add('active','entering');
  current = el;

  const finish = () => {
    el.classList.remove('entering');
    busy = false;
    if (id.startsWith('s4_'))     startCrescendo(id);
    if (id.startsWith('result_')) revealTitle(id);
  };

  const fallback = setTimeout(finish, 500);
  el.addEventListener('animationend', () => { clearTimeout(fallback); finish(); }, { once:true });
}

/* ══════════════════════════════════════════════════════════════
   INTERACTIONS
══════════════════════════════════════════════════════════════ */
function choose(el, target) {
  if (busy) return;
  el.classList.add('flash');
  setTimeout(() => { el.classList.remove('flash'); go(target); }, 150);
}

function startCrescendo(id) {
  const container = document.getElementById(`cl_${id}`);
  if (!container) return;
  const words  = container.querySelectorAll('.crescendo-word');
  const screen = SCREENS[id];
  words.forEach((w, i) => {
    setTimeout(() => {
      w.classList.add('show');
      if (i === words.length - 1) setTimeout(() => go(screen.next), 900);
    }, 320 + i * 420);
  });
}

function revealTitle(id) {
  const el = document.getElementById(`rt_${id}`);
  if (el) setTimeout(() => el.classList.add('reveal'), 120);
}

/* ══════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════ */
const overlay = document.getElementById('overlay');

function openModal(metier) {
  // Update métier tag
  const tag = document.getElementById('modal-metier-tag');
  if (tag) tag.textContent = METIER_LABELS[metier] || 'Votre profil';

  // Reset to form view
  document.getElementById('modal-form').style.display = '';
  document.getElementById('modal-confirm').classList.remove('show');
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Envoyer ma demande →';
  btn.disabled = false;

  overlay.classList.add('open');
}

function closeModal() { overlay.classList.remove('open'); }

function overlayClick(e) {
  if (e.target === overlay) closeModal();
}

function submitForm() {
  const prenom = document.getElementById('f-prenom').value.trim();
  const email  = document.getElementById('f-email').value.trim();
  const tel    = document.getElementById('f-tel').value.trim();
  const ville  = document.getElementById('f-ville').value.trim();
  const rgpd   = document.getElementById('f-rgpd').checked;

  if (!prenom || !email || !tel || !ville) {
    // Highlight empty required fields
    [['f-prenom',prenom],['f-email',email],['f-tel',tel],['f-ville',ville]].forEach(([id,val]) => {
      const el = document.getElementById(id);
      el.style.borderColor = val ? '' : 'var(--rouge)';
    });
    return;
  }
  if (!rgpd) {
    document.getElementById('f-rgpd').style.outline = '2px solid var(--rouge)';
    return;
  }

  // Show confirmation
  document.getElementById('modal-form').style.display = 'none';
  document.getElementById('modal-confirm').classList.add('show');
}

function restartFromModal() {
  closeModal();
  setTimeout(() => go('s0'), 350);
}

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
go('s0');
</script>
