<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EAC — Découvrez votre métier</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&f[]=satoshi@400,500&display=swap">
  <style>
    :root {
      --rouge:  #DC0D17;
      --navy:   #1C2459;
      --teal:   #00667D;
      --dark:   #000721;
      --white:  #FFFFFF;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse 80% 55% at 105% -5%, rgba(0,102,125,.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at -10% 110%, rgba(28,36,89,.6) 0%, transparent 55%);
      color: var(--white);
      font-family: 'Satoshi', system-ui, sans-serif;
      font-weight: 400;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100svh;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Logo ─────────────────────────────────────────────── */
    .logo {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
      color: var(--white);
      line-height: 1;
      user-select: none;
    }
    .logo .a { color: var(--rouge); }

    /* ── Screens ──────────────────────────────────────────── */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      padding: 28px 22px 36px;
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      will-change: transform, opacity;
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active  { display: flex; }
    .screen.entering { animation: screenIn  450ms ease-out both; }
    .screen.exiting  { animation: screenOut 220ms ease-in  both; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes screenOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-14px); }
    }

    /* ── Header row ───────────────────────────────────────── */
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      flex-shrink: 0;
    }

    /* ── Progress dots ────────────────────────────────────── */
    .progress {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      transition: background 300ms ease;
    }
    .dot.on { background: var(--rouge); }

    /* ── Screen body layout ───────────────────────────────── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding-bottom: 8px;
    }

    .tag {
      font-weight: 500;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .accent {
      width: 36px; height: 3px;
      background: var(--teal);
      border-radius: 2px;
    }

    .screen-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .screen-body {
      font-size: .9375rem;
      line-height: 1.65;
      color: rgba(255,255,255,.68);
    }

    /* ── Choices ──────────────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 13px;
      cursor: pointer;
      transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
      user-select: none;
    }
    .choice:hover {
      transform: translateX(6px);
      border-color: rgba(255,255,255,.32);
      background: rgba(255,255,255,.08);
    }
    .choice:active,
    .choice.flash { border-color: var(--rouge); }

    .choice-text {
      font-weight: 500;
      font-size: .9375rem;
      color: var(--white);
    }
    .choice-arrow {
      font-size: 1rem;
      color: rgba(255,255,255,.38);
      flex-shrink: 0;
    }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 17px 24px;
      background: var(--rouge);
      color: var(--white);
      border: none;
      border-radius: 13px;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.0625rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: opacity 200ms, transform 150ms;
      text-align: center;
    }
    .btn:hover  { opacity: .92; }
    .btn:active { transform: scale(.98); }

    /* ── s0 — Hero screen ─────────────────────────────────── */
    .badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(220,13,23,.14);
      border: 1px solid rgba(220,13,23,.3);
      border-radius: 100px;
      padding: 5px 13px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--rouge);
    }
    .badge-chip::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rouge);
      flex-shrink: 0;
    }

    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 24px 0;
    }

    .hero-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2.375rem;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .hero-body {
      font-size: 1rem;
      line-height: 1.65;
      color: rgba(255,255,255,.68);
    }

    .baseline {
      font-size: .8rem;
      font-weight: 500;
      color: rgba(255,255,255,.38);
      letter-spacing: .02em;
    }

    .bottom-wrap {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex-shrink: 0;
    }

    .hint {
      text-align: center;
      font-size: .8125rem;
      font-weight: 500;
      color: rgba(255,255,255,.35);
    }

    /* ── s4 — Crescendo screen ────────────────────────────── */
    .crescendo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0;
    }

    .crescendo-word {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2.125rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 480ms ease, transform 480ms ease;
    }
    .crescendo-word.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── result_* — Result screen ─────────────────────────── */
    .result-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0,102,125,.18);
      border: 1px solid rgba(0,102,125,.35);
      border-radius: 100px;
      padding: 5px 13px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--teal);
    }

    .result-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.12;
      letter-spacing: -0.03em;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 500ms ease, transform 500ms ease;
    }
    .result-title.reveal {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Modal ────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,7,33,.78);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--navy);
      border-radius: 22px 22px 0 0;
      padding: 28px 22px 44px;
      transform: translateY(100%);
      transition: transform 400ms cubic-bezier(.25,.46,.45,.94);
    }
    .overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 38px; height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-close {
      position: absolute;
      top: 18px; right: 18px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: none;
      color: var(--white);
      font-size: .9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 200ms;
    }
    .modal-close:hover { background: rgba(255,255,255,.18); }

    .modal-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      margin-bottom: 7px;
    }

    .modal-sub {
      font-size: .9375rem;
      color: rgba(255,255,255,.62);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 14px;
    }

    .field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 11px;
      color: var(--white);
      font-family: 'Satoshi', sans-serif;
      font-size: .9375rem;
      outline: none;
      transition: border-color 200ms;
    }
    .field::placeholder { color: rgba(255,255,255,.32); }
    .field:focus { border-color: var(--teal); }

    .btn-success { background: var(--teal) !important; }
  </style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    <p class="tag" style="margin-bottom:6px">Votre profil</p>
    <h2 class="modal-title">Recevez votre analyse complète</h2>
    <p class="modal-sub">Inscrivez-vous pour découvrir le programme qui correspond exactement à votre profil.</p>
    <div class="form-group">
      <input class="field" type="text"  placeholder="Prénom"   autocomplete="given-name">
      <input class="field" type="email" placeholder="Email"    autocomplete="email">
      <input class="field" type="tel"   placeholder="Téléphone (optionnel)" autocomplete="tel">
    </div>
    <button class="btn" id="submitBtn" onclick="submitForm()">Recevoir mon analyse →</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   A/B TESTING
══════════════════════════════════════════════════════════════ */
const VERSION = (new URLSearchParams(window.location.search).get('v') || 'a').toLowerCase();

const QUESTIONS_A = {};
const QUESTIONS_B = {};

const Q = VERSION === 'b' ? QUESTIONS_B : QUESTIONS_A;

/* ══════════════════════════════════════════════════════════════
   SCREEN DEFINITIONS
══════════════════════════════════════════════════════════════ */
const METIERS = [
  'galeriste','marchand','commissaire',
  'agent','programmateur','festival',
  'tendances','community','evenementiel'
];

const S2_ROUTES = {
  art:     ['galeriste','marchand','commissaire'],
  culture: ['agent','programmateur','festival'],
  luxe:    ['tendances','community','evenementiel']
};

const SCREENS = {};

SCREENS.s0 = { id:'s0', type:'hero', step:0 };

SCREENS.s1 = {
  id:'s1', type:'question', step:1,
  act:'Acte 1',
  title:'CONTENU À VENIR',
  body:'CONTENU À VENIR',
  choices:[
    { text:'Art',     target:'s2_art' },
    { text:'Culture', target:'s2_culture' },
    { text:'Luxe',    target:'s2_luxe' }
  ]
};

Object.entries(S2_ROUTES).forEach(([domain, metiers]) => {
  SCREENS[`s2_${domain}`] = {
    id:`s2_${domain}`, type:'question', step:2,
    act:'Acte 2',
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR',
    choices: metiers.map((m, i) => ({
      text:`Choix ${i+1} — CONTENU À VENIR`,
      target:`s3_${m}`
    }))
  };
});

METIERS.forEach(m => {
  SCREENS[`s3_${m}`] = {
    id:`s3_${m}`, type:'question', step:3,
    act:'Acte 3',
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR',
    choices:[
      { text:'Choix A — CONTENU À VENIR', target:`s4_${m}` },
      { text:'Choix B — CONTENU À VENIR', target:`s4_${m}` }
    ]
  };
});

METIERS.forEach(m => {
  SCREENS[`s4_${m}`] = {
    id:`s4_${m}`, type:'crescendo', step:4,
    next:`result_${m}`,
    words:['CONTENU','À','VENIR']
  };
});

METIERS.forEach(m => {
  SCREENS[`result_${m}`] = {
    id:`result_${m}`, type:'result', step:5,
    metier:m,
    title:'CONTENU À VENIR',
    body:'CONTENU À VENIR'
  };
});

/* ══════════════════════════════════════════════════════════════
   RENDER HELPERS
══════════════════════════════════════════════════════════════ */
function dots(filled) {
  return '<div class="progress">' +
    [0,1,2,3].map(i => `<div class="dot${i < filled ? ' on':''}"></div>`).join('') +
    '</div>';
}

function hdr(s) {
  const right = (s.step >= 1 && s.step <= 4) ? dots(s.step) : '';
  return `<div class="screen-header"><div class="logo">E<span class="a">A</span>C</div>${right}</div>`;
}

function buildHero(s) {
  return `${hdr(s)}
    <div class="hero-section">
      <span class="badge-chip">Quiz professionnel</span>
      <div class="accent"></div>
      <h1 class="hero-title">CONTENU À VENIR</h1>
      <p class="hero-body">CONTENU À VENIR</p>
      <p class="baseline">L'école du marché de l'art, du luxe et de la culture</p>
    </div>
    <div class="bottom-wrap">
      <button class="btn" onclick="go('s1')">Commencer →</button>
      <p class="hint">2 minutes · 7 questions</p>
    </div>`;
}

function buildQuestion(s) {
  const d = Q[s.id] || {};
  const choicesHtml = s.choices.map(c =>
    `<div class="choice" onclick="choose(this,'${c.target}')">
       <span class="choice-text">${c.text}</span>
       <span class="choice-arrow">→</span>
     </div>`
  ).join('');
  return `${hdr(s)}
    <div class="screen-content">
      <span class="tag">${s.act}</span>
      <h2 class="screen-title">${d.title || s.title}</h2>
      <p class="screen-body">${d.body || s.body}</p>
    </div>
    <div class="choices">${choicesHtml}</div>`;
}

function buildCrescendo(s) {
  const words = s.words.map((w,i) =>
    `<div class="crescendo-word" data-i="${i}">${w}</div>`
  ).join('');
  return `${hdr(s)}
    <div class="screen-content">
      <span class="tag" style="color:rgba(255,255,255,.4)">Votre profil se dessine…</span>
      <div class="crescendo-list" id="cl_${s.id}">${words}</div>
    </div>`;
}

function buildResult(s) {
  const d = Q[s.id] || {};
  return `${hdr(s)}
    <div class="screen-content">
      <span class="result-pill">Votre métier</span>
      <div class="accent"></div>
      <h2 class="result-title" id="rt_${s.id}">${d.title || s.title}</h2>
      <p class="screen-body">${d.body || s.body}</p>
    </div>
    <div class="bottom-wrap">
      <button class="btn" onclick="openModal()">Recevoir mon analyse complète →</button>
      <p class="hint" style="cursor:pointer" onclick="go('s0')">Recommencer</p>
    </div>`;
}

const BUILDERS = { hero:buildHero, question:buildQuestion, crescendo:buildCrescendo, result:buildResult };

/* ══════════════════════════════════════════════════════════════
   MOUNT ALL SCREENS
══════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');

Object.values(SCREENS).forEach(s => {
  const el = document.createElement('div');
  el.className = 'screen';
  el.id = s.id;
  el.innerHTML = BUILDERS[s.type](s);
  app.appendChild(el);
});

/* ══════════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════════ */
let current = null;
let busy    = false;

function go(id) {
  if (busy) return;
  const next = document.getElementById(id);
  if (!next) return;

  if (current) {
    busy = true;
    current.classList.add('exiting');
    const out = current;
    setTimeout(() => {
      out.classList.remove('active','exiting');
      activate(next, id);
    }, 220);
  } else {
    activate(next, id);
  }
}

function activate(el, id) {
  el.classList.add('active','entering');
  current = el;

  const finish = () => {
    el.classList.remove('entering');
    busy = false;
    if (id.startsWith('s4_'))     startCrescendo(id);
    if (id.startsWith('result_')) revealTitle(id);
  };

  const fallback = setTimeout(finish, 500);
  el.addEventListener('animationend', () => { clearTimeout(fallback); finish(); }, { once:true });
}

/* ══════════════════════════════════════════════════════════════
   INTERACTIONS
══════════════════════════════════════════════════════════════ */
function choose(el, target) {
  if (busy) return;
  el.classList.add('flash');
  setTimeout(() => { el.classList.remove('flash'); go(target); }, 150);
}

function startCrescendo(id) {
  const container = document.getElementById(`cl_${id}`);
  if (!container) return;
  const words  = container.querySelectorAll('.crescendo-word');
  const screen = SCREENS[id];
  words.forEach((w, i) => {
    setTimeout(() => {
      w.classList.add('show');
      if (i === words.length - 1) setTimeout(() => go(screen.next), 900);
    }, 320 + i * 420);
  });
}

function revealTitle(id) {
  const el = document.getElementById(`rt_${id}`);
  if (el) setTimeout(() => el.classList.add('reveal'), 120);
}

/* ══════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════ */
const overlay = document.getElementById('overlay');

function openModal()  { overlay.classList.add('open'); }
function closeModal() { overlay.classList.remove('open'); }

function overlayClick(e) {
  if (e.target === overlay) closeModal();
}

function submitForm() {
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Envoyé ✓';
  btn.classList.add('btn-success');
  setTimeout(closeModal, 1600);
}

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
go('s0');
</script>
</body>
</html>
