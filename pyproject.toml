[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alone"
version = "0.1.0"
description = "Alone — moteur de rendu de templates Adobe (SVG/Illustrator, PSD/Photoshop, IDML/InDesign) pilotable par API REST"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10.0",
    "psd-tools>=1.9.30",
    "lxml>=4.9",
    "cairosvg>=2.7",
    "httpx>=0.27",
    "fonttools>=4.47",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alone = "alone.cli:main"

[tool.setuptools.packages.find]
include = ["alone*"]

[tool.setuptools.package-data]
alone = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
